# בונה APK מוכן להתקנה, בענן, בחינם.
# הפעלה: לשונית Actions בגיטהאב -> Build APK -> Run workflow.
# בסיום, ה-APK יושב תחת Artifacts בתחתית עמוד ההרצה.

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: התקנת Android SDK
        uses: android-actions/setup-android@v3

      - name: הרכבת הפרויקט
        env:
          FREEYOU_OUT: ${{ runner.temp }}/FreeYouApp
        run: bash setup.sh

      - name: בניית APK
        working-directory: ${{ runner.temp }}/FreeYouApp/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: שינוי שם לקובץ ברור
        run: |
          mkdir -p out
          cp "${{ runner.temp }}"/FreeYouApp/android/app/build/outputs/apk/release/*.apk \
             out/FreeYou.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FreeYou-APK
          path: out/FreeYou.apk
          retention-days: 30
